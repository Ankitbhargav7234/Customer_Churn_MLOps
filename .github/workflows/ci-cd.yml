name: ML CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

    # 1. Checkout code
    - name: Checkout Repository
      uses: actions/checkout@v3

    # 2. Set up Python
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    # 3. Install dependencies
    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    # 4. Run tests
    - name: Run Tests
      run: |
        pytest tests/

    # 5. Login to Docker Hub
    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 6. Build Docker image
    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/customer-churn-mlops:latest -f docker/Dockerfile .

    # 7. Push Docker image
    - name: Push Docker Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/customer-churn-mlops:latest

    # 8. Setup kubectl
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3

    # 9. Configure kubeconfig
    - name: Configure Kubernetes
      run: |
        echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > kubeconfig
        export KUBECONFIG=kubeconfig

    # 10. Deploy to Kubernetes
    - name: Deploy to K8s
      run: |
        kubectl apply -f k8s/
        kubectl rollout restart deployment customer-churn-mlops-deployment